name: Publish Release

run-name: Release v${{ inputs.version_name }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android versionName, for example 1.2.3
        required: true
        type: string
      version_code:
        description: Android versionCode, must be a positive integer
        required: true
        type: string
      prerelease:
        description: Mark this GitHub Release as prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+([.][0-9A-Za-z_-]+)*$ ]]; then
            echo "Invalid version_name: $VERSION_NAME" >&2
            exit 1
          fi
          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "version_code must be a positive integer." >&2
            exit 1
          fi
          if git rev-parse "v$VERSION_NAME" >/dev/null 2>&1; then
            echo "Tag v$VERSION_NAME already exists." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo 'Missing Android signing secrets.' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          bash ./gradlew assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            --stacktrace

      - name: Rename release APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [[ -z "$APK_PATH" ]]; then
            echo 'Release APK was not generated.' >&2
            exit 1
          fi
          cp "$APK_PATH" "app/build/outputs/apk/release/cfst-${VERSION_NAME}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          ARGS=(
            "v$VERSION_NAME"
            "app/build/outputs/apk/release/cfst-${VERSION_NAME}.apk"
            --target "$GITHUB_SHA"
            --title "v$VERSION_NAME"
            --generate-notes
          )
          if [[ "$PRERELEASE" == 'true' ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"
